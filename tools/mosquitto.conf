# Bench broker for TriageBox station bring-up. Run it on the PC that the
# W5500 is cabled directly to:
#
#   "C:\Program Files\mosquitto\mosquitto.exe" -c tools\mosquitto.conf -v
#
# Two Mosquitto 2.x defaults would each break this setup on their own, which
# is the only reason the first two directives exist:
#   - with no listener defined at all, Mosquitto binds 127.0.0.1 only, so the
#     station's SYN to 192.168.50.1 is never answered and the ESP32 logs a
#     transport connect timeout that looks like a network fault;
#   - as soon as a listener IS defined, allow_anonymous flips to false, so a
#     client with no credentials is refused with CONNACK 5 -- which the
#     station also logs as a transport error, and retries forever.
#
# Bound to 192.168.50.1 rather than 0.0.0.0 ON PURPOSE. This PC is also on
# Wi-Fi; 0.0.0.0 would publish an unauthenticated broker to that network too.
# This address is the direct-cable interface, so the only thing that can reach
# it is the station on the other end of the wire.
listener 1883 192.168.50.1

# ponytail: anonymous access, correct ONLY while CONFIG_TB_MQTT_USERNAME and
# CONFIG_TB_MQTT_PASSWORD are empty in the station's sdkconfig. Before this
# broker is ever reachable from a real network, replace with:
#   allow_anonymous false
#   password_file C:\Program Files\mosquitto\passwd
# and create it with `mosquitto_passwd -c passwd triagebox`.
allow_anonymous true
